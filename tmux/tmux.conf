# ============================================
# tmux config for parallel Claude Code sessions
# ============================================

# --- 기본 설정 ---
set -g mouse on                    # 마우스 스크롤/클릭/패널 선택
set -g base-index 1                # 윈도우 번호 1부터
setw -g pane-base-index 1          # 패널 번호 1부터
set -g history-limit 50000         # 스크롤백 버퍼 (Claude 출력 길어서 넉넉히)
set -g allow-rename off            # 프로그램이 윈도우/패널 이름 덮어쓰기 방지
setw -g automatic-rename off       # 자동 이름 변경 비활성화
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"   # Ghostty true color (RGB capability)
set -g allow-passthrough on                        # Ghostty 이미지/특수 시퀀스 패스스루

# --- 키바인딩 ---
# prefix를 Ctrl+a로 변경 (Ctrl+b보다 손이 편함)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 패널 분할 (직관적)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 새 윈도우 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# 패널 이동 (vim 스타일)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 패널 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 윈도우 빠른 전환 (Cmd+번호 → Ghostty가 \x01 + 숫자로 전달)
# Ghostty config에서 super+숫자 → prefix + 숫자로 매핑

# --- 상태바 (Catppuccin Mocha + Nerd Font icons) ---
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#1e1e2e] "
set -g status-left-length 30
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a]  %m/%d  %H:%M #[fg=#f5c2e7,bg=#45475a]#[fg=#1e1e2e,bg=#f5c2e7,bold] 󰊠 "
set -g status-right-length 50
set -g window-status-current-format "#[fg=#1e1e2e]#[fg=#1e1e2e,bg=#89b4fa,bold]  #I  #W#{?#{||:#{@cwait},#{@cdone}}, #[fg=#1e1e2e](#{?@cwait,#[fg=#8f3f00 bold]#{@cwait}#[fg=#1e1e2e nobold],}#{?#{&&:#{@cwait},#{@cdone}},#[fg=#45475a]·,}#{?@cdone,#[fg=#1a5c2e bold]#{@cdone}#[fg=#1e1e2e nobold],})#[fg=#1e1e2e nobold],} #[fg=#89b4fa,bg=#1e1e2e]"
set -g window-status-format "#[fg=#1e1e2e]#[fg=#6c7086,bg=#313244]  #I  #W#{?#{||:#{@cwait},#{@cdone}}, #[fg=#6c7086](#{?@cwait,#[fg=#fab387 bold]#{@cwait}#[fg=#6c7086 nobold],}#{?#{&&:#{@cwait},#{@cdone}},#[fg=#585b70]·,}#{?@cdone,#[fg=#a6e3a1 bold]#{@cdone}#[fg=#6c7086 nobold],})#[fg=#6c7086 nobold],} #[fg=#313244,bg=#1e1e2e]"
set -g window-status-separator ""

# --- 패널 ---
set -g pane-border-status top
set -g pane-border-format " #[fg=#6c7086]#{pane_index}  #{?@pname,#[fg=#cdd6f4]#[bold]#{@pname}#[fg=#6c7086]#[nobold],#{b:pane_current_path} · #{pane_current_command}} #{?#{==:#{@cstate},run},#[bg=#89b4fa fg=#11111b bold] ▸ 진행중 #[default],}#{?#{==:#{@cstate},wait},#[bg=#fab387 fg=#11111b bold] ! 권한대기 #[default],}#{?#{==:#{@cstate},done},#[bg=#a6e3a1 fg=#11111b bold] ✓ 완료 #[default],}"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#f5c2e7"

# --- 클립보드 (macOS) ---
set -g set-clipboard on
setw -g mode-keys vi

# 마우스 드래그 → 자동 복사 (패널 단위, 시스템 클립보드)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# vi 스타일 복사 모드: Ctrl+a → [ 진입, v로 선택, y로 복사
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- 패널 이름 변경 (Ctrl+a n) ---
# 윈도우 전환은 Cmd+숫자로 처리하므로 기본 next-window 대신 n을 패널 이름 변경에 사용
bind n command-prompt -p "패널 이름:" "set-option -p @pname '%%'"

# --- 설정 리로드 ---
bind r source-file ~/.tmux.conf \; display "설정 리로드 완료"

# --- 확장 키 (Shift+Enter 등 CSI u 시퀀스 전달) ---
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# --- 칼럼 단위 선택 (copy-mode에서 Ctrl+v로 사각형 토글) ---
bind -T copy-mode-vi C-v send -X rectangle-toggle

# --- 성능 ---
set -sg escape-time 0              # ESC 지연 제거
set -g focus-events on             # 포커스 이벤트 전달

# --- Claude 상태 표시 (pane 칩·배경 + window 배지) ---
#   파랑 ▸ 진행중 / 주황 ! 권한대기 / 초록 ✓ 완료 — pane 테두리 칩 + 배경 tint
#   window 이름 옆 (N) 배지는 '내 손이 필요한 것' 만: 주황=권한대기 · 초록=완료. 예: journey(1·2)
#   훅이 pane 옵션 @claude_done/@claude_wait 을 세우고 스크립트가 @cdone/@cwait 로 합산.
#   window 를 보는 순간 그 window 의 pane 배지를 전부 해제한다 (pane 들이 한 화면에 동시 노출).
set-hook -g after-select-window 'run-shell -b "bash ~/.claude/scripts/tmux-claude-badge.sh clearwin #{pane_id}"'
# tmux 3.6 에는 pane-focus-in 전역 훅이 없다 (조용히 무시되던 죽은 줄) → after-select-pane 으로 교체
set-hook -g after-select-pane   'run-shell -b "bash ~/.claude/scripts/tmux-claude-badge.sh clearwin #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "bash ~/.claude/scripts/tmux-claude-badge.sh clearwin #{pane_id}"'
